<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>課堂抽籤機</title>
<style>
:root{
  --board:#1f3b34; --board-2:#27493f; --chalk:#f4f1e6; --chalk-dim:#b9c7bf;
  --yellow:#f6d55c; --red:#ff7a59; --line:rgba(244,241,230,.28);
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--board);color:var(--chalk);font-family:var(--font);font-size:18px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:340px 1fr;min-height:100vh}

/* 設定欄 */
aside{background:var(--board-2);border-right:2px dashed var(--line);padding:22px 20px;overflow-y:auto}
aside h1{font-size:26px;margin:0 0 18px;letter-spacing:.05em}
.field{margin-bottom:18px}
.field>label,.field>.lab{display:block;font-size:15px;color:var(--chalk-dim);margin-bottom:6px}
.seg{display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:9px;background:none;border:0;cursor:pointer;font-size:17px}
.seg button[aria-pressed=true]{background:var(--chalk);color:var(--board);font-weight:700}
input[type=number],select,textarea{width:100%;background:rgba(0,0,0,.22);border:2px solid var(--line);border-radius:10px;padding:9px 12px;font-size:17px}
select option{color:#222}
textarea{resize:vertical;min-height:110px}
.check{display:flex;gap:10px;align-items:center;margin-bottom:10px;cursor:pointer;font-size:17px}
.check input{width:20px;height:20px;accent-color:var(--yellow)}
.small{font-size:14px;color:var(--chalk-dim);margin-top:4px}
.ghost{background:none;border:2px solid var(--line);border-radius:10px;padding:7px 14px;cursor:pointer;font-size:15px}
.ghost:hover{border-color:var(--chalk)}

/* 舞台 */
main{display:flex;flex-direction:column;padding:24px 34px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--chalk-dim)}
.top b{color:var(--yellow);font-size:22px}
#stage{flex:1;min-height:280px;display:flex;flex-wrap:wrap;gap:18px;align-content:center;justify-content:center;padding:18px 0}
#stage.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));align-content:start;justify-content:stretch;max-height:62vh;overflow-y:auto;padding:18px 6px 18px 0}
.card{background:var(--chalk);color:var(--board);border-radius:18px;font-weight:800;text-align:center;
  padding:.15em .5em;min-width:2.2em;max-width:100%;overflow-wrap:anywhere;box-shadow:0 8px 0 rgba(0,0,0,.28);
  font-size:var(--fs,120px);line-height:1.3}
.card.spin{background:#dfe8e2;color:#5b7a6e}
.card.lock{animation:pop .35s ease-out;background:var(--yellow)}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.hint{color:var(--chalk-dim);font-size:26px;text-align:center;grid-column:1/-1;align-self:center}
#err{display:none;background:var(--red);color:#2a0d05;border-radius:12px;padding:12px 18px;font-weight:700;font-size:20px;margin-bottom:10px}
.actions{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap}
#go{background:var(--yellow);color:var(--board);border:0;border-radius:16px;padding:14px 56px;font-size:32px;font-weight:800;cursor:pointer;box-shadow:0 6px 0 #b79a2c}
#go:active{transform:translateY(4px);box-shadow:0 2px 0 #b79a2c}
#go:disabled{opacity:.55;cursor:wait}
.count{display:flex;align-items:center;gap:8px;font-size:20px}
.count input{width:80px;font-size:24px;text-align:center}

/* 分組卡片 */
.gcard{background:var(--chalk);color:var(--board);border-radius:14px;padding:12px 16px 14px;box-shadow:0 6px 0 rgba(0,0,0,.28);animation:pop .35s ease-out}
.gcard h3{margin:0 0 6px;font-size:22px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px dashed rgba(31,59,52,.35);padding-bottom:4px}
.gcard h3 span{font-size:14px;font-weight:500;color:#5b7a6e}
.gcard ul{list-style:none;margin:0;padding:0}
.gcard li{font-size:22px;padding:2px 0;display:flex;align-items:center;gap:8px}
.gcard li i{font-style:normal;font-size:13px;color:#5b7a6e}
.gcard li.leader{background:var(--yellow);font-weight:800;border-radius:8px;padding:2px 8px;margin:2px -8px}
.gcard li.leader b{font-size:13px;background:var(--board);color:var(--yellow);border-radius:6px;padding:0 6px;margin-left:auto}

/* 紀錄 */
.hist{margin-top:20px;border-top:2px dashed var(--line);padding-top:12px}
.hist-head{display:flex;justify-content:space-between;align-items:center}
.hist h2{font-size:18px;margin:0;color:var(--chalk-dim);font-weight:500}
#hist{list-style:none;margin:8px 0 0;padding:0;max-height:150px;overflow-y:auto}
#hist li{display:flex;gap:14px;padding:4px 0;border-bottom:1px solid var(--line);font-size:17px}
#hist .t{color:var(--chalk-dim);flex:none}
#hist .r{color:var(--yellow);font-weight:700}

@media (max-width:860px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:2px dashed var(--line)}main{padding:18px}#stage.groups{max-height:none}}
@media (prefers-reduced-motion:reduce){.card.lock,.gcard{animation:none}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>課堂抽籤機</h1>

    <div class="field">
      <span class="lab">模式</span>
      <div class="seg" role="group" aria-label="模式">
        <button id="mNum" aria-pressed="true">號碼</button>
        <button id="mName" aria-pressed="false">姓名</button>
        <button id="mGroup" aria-pressed="false">分組</button>
      </div>
    </div>

    <div class="field" id="boxNum">
      <label for="max">全班人數（號碼 1 ～ N）</label>
      <input type="number" id="max" min="1" max="999" value="30">
    </div>

    <div class="field" id="boxName" hidden>
      <label for="names" id="namesLab">姓名名單（每行一位）</label>
      <textarea id="names" placeholder="王小明 (男)&#10;李小華 (女)&#10;陳大文 (男)"></textarea>
      <div class="small" id="namesTip">分組模式請用「王小明 (男)」標示性別，也可用 (女)。</div>
    </div>

    <div id="boxGroup" hidden>
      <div class="field">
        <label for="gsize">每組人數</label>
        <input type="number" id="gsize" min="1" max="50" value="4">
        <div class="small">人數無法整除時，各組人數最多相差 1 位。</div>
      </div>
      <div class="field">
        <label for="gway">分組方式</label>
        <select id="gway">
          <option value="rand">純隨機</option>
          <option value="mix">男女混合（每組盡量男女均勻）</option>
          <option value="sep">男女分開（男生一批、女生一批）</option>
        </select>
      </div>
      <div class="field">
        <label class="check"><input type="checkbox" id="gleader" checked> 每組抽一位組長</label>
      </div>
    </div>

    <div class="field">
      <label for="excl">排除名單（缺席、已報告…）</label>
      <textarea id="excl" style="min-height:70px" placeholder="號碼或姓名，用逗號、空白或換行分隔"></textarea>
      <div class="small">號碼模式填號碼，如 3, 8, 15；姓名與分組模式填姓名（不用寫性別）。</div>
    </div>

    <div class="field">
      <label class="check" id="norepBox"><input type="checkbox" id="norep" checked> 不重複抽籤（抽過的不再抽）</label>
      <label class="check"><input type="checkbox" id="snd" checked> 音效</label>
      <button class="ghost" id="reset">重設已抽名單</button>
    </div>
  </aside>

  <main>
    <div class="top">
      <span><span id="leftLab">剩餘可抽</span>：<b id="left">0</b> 位</span>
      <span id="mode-label"></span>
    </div>

    <div id="stage" aria-live="polite"><div class="hint">按下「抽籤」開始</div></div>
    <div id="err" role="alert"></div>

    <div class="actions">
      <div class="count" id="countBox"><label for="n">一次抽</label><input type="number" id="n" min="1" max="50" value="1"><span>位</span></div>
      <button id="go">抽籤</button>
    </div>

    <section class="hist">
      <div class="hist-head"><h2>抽籤紀錄</h2><button class="ghost" id="clr">清除紀錄</button></div>
      <ul id="hist"></ul>
    </section>
  </main>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const KEY = 'classroom-lottery-v1';
  const MODE_TXT = {num:'號碼', name:'姓名', group:'分組'};
  let S = {mode:'num', max:30, names:'', excl:'', n:1, norep:true, snd:true, drawn:[], hist:[],
           gsize:4, gway:'rand', gleader:true, groups:[]};
  let running = false, actx = null;

  /* ---------- 儲存 ---------- */
  function load(){
    try{ const d = JSON.parse(localStorage.getItem(KEY)||'null'); if(d) S = Object.assign(S,d); }catch(e){}
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

  /* ---------- 名單計算 ---------- */
  const split = t => t.split(/[,，、\s]+/).map(s=>s.trim()).filter(Boolean);
  const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

  // 解析「王小明 (男)」→ {name:'王小明', g:'男'}
  function parsePeople(){
    const seen = new Set(), out = [];
    S.names.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).forEach(line=>{
      const m = line.match(/^(.*?)\s*[（(]\s*(男|女)\s*[)）]\s*$/);
      const p = m ? {name:m[1].trim(), g:m[2], raw:line} : {name:line, g:'', raw:line};
      if(p.name && !seen.has(p.name)){ seen.add(p.name); out.push(p); }
    });
    return out;
  }
  function excluded(){ return new Set(split(S.excl)); }
  function groupPeople(){
    const ex = excluded();
    return parsePeople().filter(p => !ex.has(p.name) && !ex.has(p.raw));
  }
  function allItems(){
    if(S.mode==='num'){
      const m = Math.max(0, parseInt(S.max)||0), a=[];
      for(let i=1;i<=m;i++) a.push(String(i));
      return a;
    }
    return parsePeople().map(p=>p.name);
  }
  function pool(){
    const ex = excluded(), dr = new Set(S.drawn);
    return allItems().filter(x => !ex.has(x) && !(S.norep && dr.has(x)));
  }

  /* ---------- 音效 ---------- */
  function beep(f,d,type,vol){
    if(!S.snd) return;
    try{
      actx = actx || new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==='suspended') actx.resume();
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
      o.type = type||'square'; o.frequency.value = f;
      g.gain.setValueAtTime(vol||.07,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d);
    }catch(e){}
  }
  const tick = () => beep(500+Math.random()*500,.05,'square',.05);
  const lockSnd = () => beep(880,.18,'triangle',.12);
  function fanfare(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.28,'triangle',.14),i*130)); }

  /* ---------- 畫面 ---------- */
  function showErr(msg){ const e=$('err'); e.textContent=msg; e.style.display=msg?'block':'none'; }
  function fontSize(n,sample){
    const long = Math.max(1,...sample.map(s=>s.length));
    let base = n<=1?170 : n<=2?140 : n<=4?110 : n<=8?80 : n<=15?58 : 44;
    if(long>2) base = base*Math.max(.45, 2.6/long);
    return Math.round(base);
  }
  function showHint(){
    const st = $('stage'); st.className=''; st.innerHTML='';
    const h = document.createElement('div'); h.className='hint';
    h.textContent = S.mode==='group' ? '設定每組人數後，按下「分組」' : '按下「抽籤」開始';
    st.appendChild(h);
  }
  function refresh(){
    const g = S.mode==='group';
    $('mNum').setAttribute('aria-pressed', S.mode==='num');
    $('mName').setAttribute('aria-pressed', S.mode==='name');
    $('mGroup').setAttribute('aria-pressed', g);
    $('boxNum').hidden = S.mode!=='num';
    $('boxName').hidden = S.mode==='num';
    $('boxGroup').hidden = !g;
    $('countBox').hidden = g;
    $('norepBox').hidden = g;
    $('reset').hidden = g;
    $('namesTip').hidden = !g;
    $('go').textContent = g ? '分組' : '抽籤';
    $('leftLab').textContent = g ? '可分組人數' : '剩餘可抽';
    $('left').textContent = g ? groupPeople().length : pool().length;
    $('mode-label').textContent = MODE_TXT[S.mode]+'模式';
    $('reset').textContent = '重設已抽名單（已抽 '+S.drawn.length+' 位）';
    renderHist();
  }
  function setMode(m){
    S.mode = m; save(); showErr(''); refresh();
    if(m==='group' && S.groups.length) renderGroups(S.groups, false); else showHint();
  }
  function renderHist(){
    const ul = $('hist'); ul.innerHTML='';
    if(!S.hist.length){ const li=document.createElement('li'); li.textContent='尚無紀錄'; li.style.color='var(--chalk-dim)'; ul.appendChild(li); return; }
    S.hist.forEach(h=>{
      const li=document.createElement('li'), t=document.createElement('span'), r=document.createElement('span');
      t.className='t'; t.textContent=h.time+'　'+h.mode; r.className='r'; r.textContent=h.items.join('、');
      li.append(t,r); ul.appendChild(li);
    });
  }
  function addHist(modeTxt, items){
    const now = new Date(), z = x=>String(x).padStart(2,'0');
    S.hist.unshift({time:z(now.getHours())+':'+z(now.getMinutes())+':'+z(now.getSeconds()), mode:modeTxt, items});
    S.hist = S.hist.slice(0,100);
  }

  /* ---------- 抽籤 ---------- */
  function draw(){
    if(running) return;
    readInputs();
    if(S.mode==='group'){ return makeGroups(); }
    const p = pool(), n = parseInt(S.n);
    if(!n || n<1){ showErr('請輸入要抽的人數（至少 1 位）。'); return; }
    if(S.mode==='name' && !allItems().length){ showErr('名單是空的，請先在左側輸入姓名，每行一位。'); return; }
    if(p.length < n){
      showErr('人數不夠：目前只剩 '+p.length+' 位可抽，但你要抽 '+n+' 位。'
        + (S.norep && S.drawn.length ? '可以按「重設已抽名單」或取消「不重複抽籤」。' : '請減少人數或調整排除名單。'));
      return;
    }
    showErr('');
    const picks = shuffle(p).slice(0,n);

    running = true; $('go').disabled = true;
    const stage = $('stage'); stage.className=''; stage.innerHTML='';
    stage.style.setProperty('--fs', fontSize(n, picks)+'px');
    const cards = picks.map(()=>{ const d=document.createElement('div'); d.className='card spin'; d.textContent='?'; stage.appendChild(d); return d; });
    const locked = cards.map(()=>false);

    const timer = setInterval(()=>{
      cards.forEach((c,i)=>{ if(!locked[i]) c.textContent = p[Math.floor(Math.random()*p.length)]; });
      tick();
    }, 75);

    const step = Math.min(350, 2200/n);
    picks.forEach((v,i)=>{
      setTimeout(()=>{
        locked[i]=true; cards[i].textContent=v; cards[i].className='card lock'; lockSnd();
        if(i===n-1){ clearInterval(timer); finish(picks); }
      }, 1500 + i*step);
    });
  }
  function finish(picks){
    S.drawn = [...new Set(S.drawn.concat(picks))];
    addHist(MODE_TXT[S.mode], picks);
    save(); refresh(); fanfare();
    running = false; $('go').disabled = false;
  }

  /* ---------- 隨機分組 ---------- */
  function deal(list, g, groups, ptr){
    list.forEach(p=>{ groups[ptr % g].push(p); ptr++; });
    return ptr;
  }
  function makeGroups(){
    const people = groupPeople(), total = people.length, size = parseInt(S.gsize);
    if(!size || size<1){ showErr('請輸入每組人數（至少 1 位）。'); return; }
    if(!parsePeople().length){ showErr('名單是空的，請先在左側輸入姓名，每行一位，例如「王小明 (男)」。'); return; }
    if(total < size){
      showErr('人數不夠：可分組的只有 '+total+' 位，但每組要 '+size+' 位。請減少每組人數或調整排除名單。');
      return;
    }
    const M = shuffle(people.filter(p=>p.g==='男')),
          F = shuffle(people.filter(p=>p.g==='女')),
          U = shuffle(people.filter(p=>!p.g));
    if(S.gway!=='rand' && U.length){
      showErr('有 '+U.length+' 位沒有標示性別（'+U.slice(0,3).map(p=>p.name).join('、')+(U.length>3?'…':'')+'），'
        +(S.gway==='sep'?'他們會另外分成「未標示」組。':'他們會跟著一起平均分配。'));
    } else showErr('');

    let sets = []; // {tag, members}
    if(S.gway==='rand'){
      const g = Math.ceil(total/size), gs = Array.from({length:g},()=>[]);
      deal(shuffle(people), g, gs, 0);
      gs.forEach(m=>sets.push({tag:'', members:m}));
    } else if(S.gway==='mix'){
      const g = Math.ceil(total/size), gs = Array.from({length:g},()=>[]);
      let ptr = 0; [M,F,U].forEach(l=>{ ptr = deal(l, g, gs, ptr); });
      gs.forEach(m=>sets.push({tag:'', members:m}));
    } else {
      [['男',M],['女',F],['未標示',U]].forEach(([tag,l])=>{
        if(!l.length) return;
        const g = Math.ceil(l.length/size), gs = Array.from({length:g},()=>[]);
        deal(l, g, gs, 0);
        gs.forEach(m=>sets.push({tag, members:m}));
      });
    }
    const groups = sets.map((s,i)=>{
      const members = shuffle(s.members).map(p=>({name:p.name, g:p.g}));
      return {label:'第 '+(i+1)+' 組'+(s.tag?'（'+s.tag+'）':''), members,
              leader: S.gleader ? Math.floor(Math.random()*members.length) : -1};
    });
    S.groups = groups;
    const wayTxt = {rand:'純隨機', mix:'男女混合', sep:'男女分開'}[S.gway];
    addHist('分組', ['共 '+groups.length+' 組（'+wayTxt+'，每組 '+size+' 人）'
      + (S.gleader ? '，組長：'+groups.map(g=>g.members[g.leader].name).join('、') : '')]);
    save(); refresh();
    renderGroups(groups, true);
  }
  function renderGroups(groups, animate){
    const st = $('stage'); st.className='groups'; st.innerHTML='';
    const build = g => {
      const c = document.createElement('div'); c.className='gcard';
      const h = document.createElement('h3'), t = document.createElement('div'), n = document.createElement('span');
      t.textContent = g.label; n.textContent = g.members.length+' 人'; h.append(t,n); c.appendChild(h);
      const ul = document.createElement('ul');
      g.members.forEach((m,i)=>{
        const li = document.createElement('li'), s = document.createElement('span');
        s.textContent = m.name; li.appendChild(s);
        if(m.g){ const gi=document.createElement('i'); gi.textContent=m.g; li.appendChild(gi); }
        if(i===g.leader){ li.className='leader'; const b=document.createElement('b'); b.textContent='組長'; li.appendChild(b); }
        ul.appendChild(li);
      });
      c.appendChild(ul); return c;
    };
    if(!animate){ groups.forEach(g=>st.appendChild(build(g))); return; }
    running = true; $('go').disabled = true;
    const step = Math.min(220, 2000/groups.length);
    groups.forEach((g,i)=>setTimeout(()=>{
      st.appendChild(build(g)); lockSnd();
      if(i===groups.length-1){ fanfare(); running=false; $('go').disabled=false; }
    }, 250 + i*step));
  }

  /* ---------- 輸入同步 ---------- */
  function readInputs(){
    S.max = parseInt($('max').value)||0;
    S.names = $('names').value;
    S.excl = $('excl').value;
    S.n = parseInt($('n').value)||1;
    S.norep = $('norep').checked;
    S.snd = $('snd').checked;
    S.gsize = parseInt($('gsize').value)||0;
    S.gway = $('gway').value;
    S.gleader = $('gleader').checked;
    save();
  }
  function writeInputs(){
    $('max').value = S.max; $('names').value = S.names; $('excl').value = S.excl;
    $('n').value = S.n; $('norep').checked = S.norep; $('snd').checked = S.snd;
    $('gsize').value = S.gsize; $('gway').value = S.gway; $('gleader').checked = S.gleader;
  }

  ['max','names','excl','n','norep','snd','gsize','gway','gleader'].forEach(id=>{
    $(id).addEventListener('input', ()=>{ readInputs(); showErr(''); refresh(); });
  });
  $('mNum').onclick = ()=>setMode('num');
  $('mName').onclick = ()=>setMode('name');
  $('mGroup').onclick = ()=>setMode('group');
  $('go').onclick = draw;
  $('reset').onclick = ()=>{ S.drawn=[]; save(); showErr(''); refresh(); };
  $('clr').onclick = ()=>{ S.hist=[]; save(); refresh(); };
  document.addEventListener('keydown', e=>{
    const tag = (document.activeElement||{}).tagName;
    if((e.code==='Space'||e.code==='Enter') && !['INPUT','TEXTAREA','BUTTON','SELECT'].includes(tag)){ e.preventDefault(); draw(); }
  });

  load(); writeInputs(); setMode(S.mode);
})();
